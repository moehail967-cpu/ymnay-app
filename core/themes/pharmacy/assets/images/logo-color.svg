<svg xmlns="http://www.w3.org/2000/svg" width="320" height="80" viewBox="0 0 320 80">

    <defs>
        <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#00897B"/>
            <stop offset="100%" stop-color="#1976D2"/>
        </linearGradient>
    </defs>

    <!-- Background Circle -->
    <circle cx="44" cy="40" r="26" fill="url(#grad)" opacity="0.12"/>
    <circle cx="44" cy="40" r="22" fill="url(#grad)"/>

    <!-- Medical Cross -->
    <g transform="translate(44 40)">
        <rect x="-3" y="-10" width="6" height="20" rx="1.5" fill="#ffffff"/>
        <rect x="-10" y="-3" width="20" height="6" rx="1.5" fill="#ffffff"/>
    </g>

    <!-- Brand Name -->
    <text x="82"
          y="35"
          font-family="Georgia, 'Times New Roman', serif"
          font-size="26"
          font-weight="700"
          fill="#00897B">
        Pharmacy
    </text>

    <!-- Tagline -->
    <text x="83"
          y="54"
          font-family="Arial, Helvetica, sans-serif"
          font-size="10.5"
          letter-spacing="2"
          fill="#00897B"
          opacity="0.7">
        HEALTH &amp; WELLNESS
    </text>

    <!-- Underline -->
    <line x1="82"
          y1="60"
          x2="200"
          y2="60"
          stroke="url(#grad)"
          stroke-width="1.5"
          opacity="0.55"/>

</svg>
