  - AdminProductServices
  - ProductGlobalTrait
  database_effects:
  - products
  - product_inventories
  - product_inventory_details
  - catalog relations
  events: []
  jobs: []
  notifications: observer-dependent
  failure_states:
  - validation/slug/relation failure
  related_modules:
  - Product
  - Inventory
  - Attributes
  - Badge
