  - success
  steps:
  - Create user/address
  - order/lines
  - hooks
  - stock/gateway
  - result
  database_effects:
  - product_orders
  - order_products
  - inventory
  events:
  - nazmart:before_order_create
  - nazmart:after_order_create
  jobs: []
  notifications: order/gateway path-dependent
  failure_states:
  - validation/payment/stock/replay risks
  related_modules:
  - Product
  - ShippingModule
  - TaxModule
  - CouponManage
  sources:
  - core/routes/tenant.php
  - core/app/Http/Services/ProductCheckoutService.php
  - core/app/Http/Services/CheckoutToPaymentService.php
  evidence: VERIFIED control path; descriptive state labels are not database enums; completion untested
- id: W05
  name: Order review
  actor: tenant admin
  trigger: change_status
  preconditions:
  - Tenant admin and validated transition
  states:
  - success payment
  - complete/cancel fulfillment
  steps:
  - Update status
  - hooks
  - stock/commission
  - mail
  database_effects:
  - product_orders
  - inventory
  - commission records
  events:
  - OrderCompleted
  jobs: []
  notifications: order mail
  failure_states:
  - transition/notification failure
  related_modules:
  - CommissionManage
