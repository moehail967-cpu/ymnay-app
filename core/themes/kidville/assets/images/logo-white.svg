<svg xmlns="http://www.w3.org/2000/svg"
     width="320"
     height="80"
     viewBox="0 0 320 80"
     fill="none">

    <!-- Background Circle -->
    <circle cx="44" cy="40" r="26" fill="#FFFFFF" opacity="0.12"/>
    <circle cx="44" cy="40" r="22" fill="#FFFFFF" opacity="0.25"/>

    <!-- Teddy Bear -->
    <!-- Ears -->
    <circle cx="35" cy="28" r="5" fill="#FFFFFF" opacity="0.9"/>
    <circle cx="53" cy="28" r="5" fill="#FFFFFF" opacity="0.9"/>

    <!-- Head -->
    <circle cx="44" cy="40" r="11" fill="#FFFFFF" opacity="0.9"/>

    <!-- Eyes -->
    <circle cx="40" cy="38" r="1.3" fill="#7B1FA2"/>
    <circle cx="48" cy="38" r="1.3" fill="#7B1FA2"/>

    <!-- Nose -->
    <circle cx="44" cy="43" r="1.6" fill="#FFB300"/>

    <!-- Smile -->
    <path d="M41 46 Q44 48 47 46"
          stroke="#7B1FA2"
          stroke-width="1.2"
          fill="none"
          stroke-linecap="round"/>

    <!-- Brand Name -->
    <text x="82"
          y="35"
          font-family="Georgia, 'Times New Roman', serif"
          font-size="26"
          font-weight="700"
          fill="#FFFFFF">
        Kidville
    </text>

    <!-- Tagline -->
    <text x="83"
          y="54"
          font-family="Arial, Helvetica, sans-serif"
          font-size="10.5"
          letter-spacing="2"
