name: Onboarding isolated regression
on:
  pull_request:
    paths:
      - 'core/app/**'
      - 'core/database/**'
      - '.ai/work/4-store-onboarding/tests/**'
      - '.github/workflows/onboarding-regression.yml'
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: isolated-fixture-only
          MYSQL_DATABASE: ymnay_onboarding_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s --health-timeout=5s --health-retries=10
    env:
      YMNAY_TEST_ALLOW_DISPOSABLE_DB: '1'
      YMNAY_TEST_DB: ymnay_onboarding_test
      YMNAY_TEST_HOST: 127.0.0.1
      YMNAY_TEST_PASSWORD: isolated-fixture-only
      CENTRAL_DOMAIN: example.invalid
      APP_ENV: testing
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Explicitly repin historical QA guard and record provenance
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib, json, os, subprocess
          p=Path('.ai/work/4-store-onboarding/tests/SalemB04ReviewTest.php')
          b=p.read_bytes()
          assert hashlib.sha1(f'blob {len(b)}\0'.encode()+b).hexdigest()=='7f35e9c339e076b3828979d38b737d057fdeb373'
          replacements={
              'b4394b4f079dbf4886c0d013c516e0d642e4a914':'12c2f66c90c828cffa187c81cf7b82468e658764',
              '138e3f605d53bd2c810addf27a3a0bfa7ea16c79':'c0e448422a448dbf62bc4ea5df1b3af7c98dfc6c',
              '5a7013b04c70fbe2ce474f53b491326b2aca89b1':'5663407c3c83ad51210312e80beeb6ba1a6fa1a2',
          }
          text=b.decode()
          for before,after in replacements.items():
              assert text.count(before)==1
              text=text.replace(before,after)
          p.write_text(text)
          # Guard and provenance strings only. No assertion or application code change.
          root=Path(os.environ['RUNNER_TEMP'])
          (root/'salem-guard-repin.json').write_text(json.dumps({'original_test_blob':'7f35e9c339e076b3828979d38b737d057fdeb373','replacements':replacements,'tested_head':subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()},indent=2))
          (root/'salem-guard-repin.diff').write_bytes(subprocess.check_output(['git','diff','--',str(p)]))
          PY
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_mysql, mbstring, xml, intl, curl, zip
          tools: composer:v2
          coverage: none
      - name: Prepare pinned isolated dependencies
        run: |
          echo "YMNAY_TEST_FIXTURE=$RUNNER_TEMP/ymnay-onboarding" >> "$GITHUB_ENV"
          YMNAY_TEST_FIXTURE="$RUNNER_TEMP/ymnay-onboarding" python .ai/work/4-store-onboarding/tests/prepare-fixture.py
          COMPOSER_POLICY_ADVISORIES_BLOCK=0 composer update --working-dir="$RUNNER_TEMP/ymnay-onboarding" --no-scripts --no-plugins --no-interaction --prefer-dist
      - name: Record existing dependency advisories (not a release security PASS)
        continue-on-error: true
        run: composer audit --working-dir="$YMNAY_TEST_FIXTURE" --format=json > "$RUNNER_TEMP/dependency-audit.json"
      - name: Check source syntax
        run: |
          php -l core/routes/web.php
          php -l core/app/Http/Controllers/Landlord/Frontend/StoreOnboardingController.php
          php -l core/app/Helpers/EmailHelpers/VerifyUserMailSend.php
          find core/app/Services/Onboarding -name '*.php' -exec php -l {} \;
          php -l core/app/Events/TenantRegisterEvent.php
          php -l core/app/Listeners/TenantDomainCreate.php
          php -l core/app/Providers/TenancyServiceProvider.php
          php -l core/database/seeders/TenantDatabaseSeeder.php
          php -l .ai/work/4-store-onboarding/tests/SalemB04ReviewTest.php
          php -l .ai/work/4-store-onboarding/tests/SalemB05RetestTest.php
      - name: Check durable stage decisions
        run: php .ai/work/4-store-onboarding/tests/stages-regression.php > "$RUNNER_TEMP/stage-results.json"
      - name: Run original, exact historical and supplementary Salem regressions
        run: |
          "$YMNAY_TEST_FIXTURE/vendor/bin/phpunit" --no-configuration --colors=never \
            --log-junit "$RUNNER_TEMP/onboarding-junit.xml" \
            .ai/work/4-store-onboarding/tests
      - name: Upload non-sensitive QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: salem-b05-${{ github.event.pull_request.head.sha }}
          path: |
            ${{ runner.temp }}/stage-results.json
            ${{ runner.temp }}/onboarding-junit.xml
            ${{ runner.temp }}/dependency-audit.json
            ${{ runner.temp }}/salem-b04-observations.json
            ${{ runner.temp }}/salem-b05-observations.json
            ${{ runner.temp }}/salem-guard-repin.json
            ${{ runner.temp }}/salem-guard-repin.diff
          if-no-files-found: ignore
