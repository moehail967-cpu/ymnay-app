name: Migrate Store Onboarding Production

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type MIGRATE_ONBOARDING to authorize the single central migration"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: ymnay-production-migration
  cancel-in-progress: false

jobs:
  migrate:
    if: ${{ github.ref == 'refs/heads/main' && inputs.confirm == 'MIGRATE_ONBOARDING' }}
    runs-on: ubuntu-latest
    environment: production
    env:
      APP_ROOT: /home/ymnay/htdocs/ymnay.com
      MIGRATION: database/migrations/2026_09_14_000001_create_store_onboarding_requests_table.php
      PROD_HOST: ${{ secrets.PRODUCTION_HOST }}
      PROD_USER: ${{ secrets.PRODUCTION_USER }}
      PROD_PORT: ${{ secrets.PRODUCTION_PORT }}
      PROD_SSH_KEY: ${{ secrets.PRODUCTION_SSH_KEY }}

    steps:
      - name: Prepare SSH
        shell: bash
        run: |
          set -euo pipefail
          : "${PROD_HOST:?Missing PRODUCTION_HOST secret}"
          : "${PROD_USER:?Missing PRODUCTION_USER secret}"
          : "${PROD_SSH_KEY:?Missing PRODUCTION_SSH_KEY secret}"
          PORT="${PROD_PORT:-22}"
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          printf '%s\n' "$PROD_SSH_KEY" > "$HOME/.ssh/id_deploy"
          chmod 600 "$HOME/.ssh/id_deploy"
          ssh-keyscan -p "$PORT" -H "$PROD_HOST" >> "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"
          echo "PORT=$PORT" >> "$GITHUB_ENV"

      - name: Run only the approved central migration
        shell: bash
        run: |
          set -euo pipefail
          ssh -i "$HOME/.ssh/id_deploy" -p "$PORT" "$PROD_USER@$PROD_HOST" "
            set -e
            cd '$APP_ROOT/core'
            test -f artisan
            test -f '.env'
            test -f '$MIGRATION'
            php artisan migrate:status --path='$MIGRATION' --no-interaction
            php artisan migrate --path='$MIGRATION' --force --no-interaction
            php artisan migrate:status --path='$MIGRATION' --no-interaction
            php artisan optimize:clear
          "

      - name: Public health check
        shell: bash
        run: |
          set -euo pipefail
          curl -fLsS --retry 4 --retry-delay 5 --connect-timeout 15 --max-time 30 https://ymnay.com/create-store >/dev/null
