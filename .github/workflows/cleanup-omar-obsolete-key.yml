name: Cleanup Obsolete Omar SSH Key

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write

jobs:
  cleanup:
    if: github.event.issue.number == 11 && github.actor == github.repository_owner && github.event.comment.body == '/cleanup-omar-obsolete-key'
    runs-on: ubuntu-latest
    environment: production
    env:
      PROD_HOST: ${{ secrets.PRODUCTION_HOST }}
      PROD_USER: ${{ secrets.PRODUCTION_USER }}
      PROD_PORT: ${{ secrets.PRODUCTION_PORT }}
      PROD_SSH_KEY: ${{ secrets.PRODUCTION_SSH_KEY }}
      OBSOLETE_KEY: 'ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAILWx3FfSYwA/u3UHpo7/VJj80ahPqK/I0dQCK8EZjeUO omar-ymnay-production'
      ACTIVE_KEY: 'ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIDuXTGkmNPkj3Jq+U84pXM4wSchgoYbetb+TVNk6T92+ omar-ymnay-production-20260917'
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Prepare SSH
        shell: bash
        run: |
          set -euo pipefail
          PORT="${PROD_PORT:-22}"
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          printf '%s\n' "$PROD_SSH_KEY" > "$HOME/.ssh/id_existing_deploy"
          chmod 600 "$HOME/.ssh/id_existing_deploy"
          ssh-keyscan -p "$PORT" -H "$PROD_HOST" >> "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"
          echo "PORT=$PORT" >> "$GITHUB_ENV"
      - name: Remove obsolete key and verify active key
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n%s\n' "$OBSOLETE_KEY" "$ACTIVE_KEY" | ssh -i "$HOME/.ssh/id_existing_deploy" -p "$PORT" "$PROD_USER@$PROD_HOST" 'set -eu; read -r OLDKEY; read -r ACTIVEKEY; FILE="$HOME/.ssh/authorized_keys"; test -f "$FILE"; TMP=$(mktemp); grep -Fvx "$OLDKEY" "$FILE" > "$TMP" || true; cat "$TMP" > "$FILE"; rm -f "$TMP"; chmod 600 "$FILE"; grep -Fqx "$ACTIVEKEY" "$FILE"; ! grep -Fqx "$OLDKEY" "$FILE"'
      - name: Report
        if: always()
        shell: bash
        run: |
          if [ "${{ job.status }}" = "success" ]; then
            gh issue comment 11 --repo "$GITHUB_REPOSITORY" --body 'OMAR SSH KEY CLEANUP: PASS — obsolete setup key removed; active Omar key verified.'
          else
            gh issue comment 11 --repo "$GITHUB_REPOSITORY" --body 'OMAR SSH KEY CLEANUP: FAIL — review required; no application deployment was authorized.'
          fi
