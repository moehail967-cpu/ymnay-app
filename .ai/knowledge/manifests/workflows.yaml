schema_version: 1
workflows:
- id: W01
  name: Registration and subscription
  actor: visitor/central user
  trigger: native registration or plan payment
  preconditions:
  - Validated identity, plan, payment inputs
  states:
  - pending
  - complete
  steps:
  - User
  - plan
  - PaymentLogs
  - payment review/IPN
  - W02
  database_effects:
  - users
  - payment_logs
  events:
  - TenantRegisterEvent
  jobs: []
  notifications: Core mail
  failure_states:
  - validation/gateway/pending approval
  related_modules:
  - Wallet
  sources:
  - core/routes/web.php
  - core/app/Http/Controllers/Landlord/Frontend/PaymentLogController.php
  evidence: VERIFIED control path; descriptive state labels are not database enums; completion untested
- id: W02
  name: Tenant provisioning
  actor: qualified central owner/admin
  trigger: TenantCreated
  preconditions:
  - Eligible trial/payment/admin creation
  states:
  - creating
  - ready; not an asserted DB enum
  steps:
  - Create DB
  - migrate
  - domain/info
  - seed
  - copy/media/mail
  database_effects:
  - tenants
  - domains
  - tenant database
  events:
  - TenantCreated
  jobs:
  - core/app/Jobs
  notifications: new store mail
  failure_states:
  - DB/migration/seed/copy failure
  related_modules:
  - CpanelAutomation
  - ThemeManage
  sources:
  - core/app/Providers/TenancyServiceProvider.php
  - core/database/seeders/TenantDatabaseSeeder.php
  evidence: VERIFIED control path; descriptive state labels are not database enums; completion untested
- id: W03
