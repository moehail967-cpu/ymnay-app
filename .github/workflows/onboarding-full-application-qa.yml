name: Onboarding full application QA

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'core/**'
      - '.ai/work/4-store-onboarding/g01/**'
      - '.github/workflows/onboarding-full-application-qa.yml'

permissions:
  contents: read

jobs:
  full-application:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: g01-isolated-only
          MYSQL_DATABASE: ymnay_g01_central
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s --health-timeout=5s --health-retries=12
      mailpit:
        image: axllent/mailpit:v1.27
        ports:
          - 1025:1025
          - 8025:8025
        options: >-
          --health-cmd="wget -q -O- http://127.0.0.1:8025/livez || exit 1"
          --health-interval=10s --health-timeout=5s --health-retries=12
    env:
      APP_ENV: testing
      APP_DEBUG: 'true'
      APP_URL: http://localhost
      CENTRAL_DOMAIN: localhost
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: ymnay_g01_central
      DB_USERNAME: root
      DB_PASSWORD: g01-isolated-only
      TENANT_DATABASE_PREFIX: ymnay_g01_tenant_
      CACHE_DRIVER: file
      SESSION_DRIVER: file
      QUEUE_CONNECTION: sync
      FILESYSTEM_DRIVER: local
      MAIL_MAILER: smtp
      MAIL_HOST: 127.0.0.1
      MAIL_PORT: 1025
      MAIL_ENCRYPTION: 'null'
      MAIL_FROM_ADDRESS: qa@example.test
      MAIL_FROM_NAME: Ymnay-G01
      TELESCOPE_ENABLED: 'false'
      YMNAY_G01: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: bcmath, ctype, curl, dom, fileinfo, gd, intl, mbstring, openssl, pdo_mysql, tokenizer, xml, zip
          tools: composer:v2
          coverage: none

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: core/package-lock.json

      - name: Record exact candidate and create isolated environment
        working-directory: core
        run: |
          mkdir -p storage/framework/cache storage/framework/sessions storage/framework/views storage/logs
          cp .env.example .env
          php -r '$p=".env"; $s=file_get_contents($p); $s=preg_replace("/^APP_KEY=.*$/m", "APP_KEY=base64:".base64_encode(random_bytes(32)), $s); file_put_contents($p,$s);'
          git rev-parse HEAD > "$RUNNER_TEMP/candidate-sha.txt"

      - name: Install the actual application dependencies
        working-directory: core
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Boot actual application and migrate disposable central database
        working-directory: core
        run: |
          set -o pipefail
          php artisan about --only=environment 2>&1 | tee "$RUNNER_TEMP/application-about.txt"
          php artisan migrate:fresh --force -vvv 2>&1 | tee "$RUNNER_TEMP/central-migrations.txt"
          php ../.ai/work/4-store-onboarding/g01/prepare.php 2>&1 | tee "$RUNNER_TEMP/g01-prepare.json"
          php artisan route:list --name=landlord.store.onboarding --json 2>&1 | tee "$RUNNER_TEMP/onboarding-routes.json"

      - name: Build actual frontend assets
        working-directory: core
        run: |
          npm ci --no-audit --no-fund
          npm run build

      - name: Run existing full-project test suites
        working-directory: core
        run: php artisan test --log-junit "$RUNNER_TEMP/full-project-junit.xml"

      - name: Install isolated browser runtime
        working-directory: .ai/work/4-store-onboarding/g01
        run: |
          npm install --ignore-scripts --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: Start real HTTP application
        working-directory: core
        run: |
          sudo -E php artisan serve --host=0.0.0.0 --port=80 > "$RUNNER_TEMP/application-server.log" 2>&1 &
          for attempt in {1..30}; do
            curl --fail --silent http://localhost/create-store >/dev/null && exit 0
            sleep 1
          done
          cat "$RUNNER_TEMP/application-server.log"
          exit 1

      - name: Exercise browser, session, OTP mail and complete provisioning
        working-directory: .ai/work/4-store-onboarding/g01
        env:
          G01_BASE_URL: http://localhost
          G01_MAILPIT_URL: http://127.0.0.1:8025
          G01_EVIDENCE_DIR: ${{ runner.temp }}/g01-browser-evidence
        run: node e2e.mjs

      - name: Attach Nour's approved visual references
        run: |
          git worktree add --detach "$RUNNER_TEMP/nour-reference" dfc56d81afb448a8432675d64d22c16340502164
          mkdir -p "$RUNNER_TEMP/g01-visual-reference"
          cp "$RUNNER_TEMP/nour-reference/.ai/work/4-store-onboarding/designs/"*.png "$RUNNER_TEMP/g01-visual-reference/"

      - name: Upload non-sensitive full-application preflight evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: onboarding-full-app-preflight-${{ github.sha }}
          path: |
            ${{ runner.temp }}/candidate-sha.txt
            ${{ runner.temp }}/application-about.txt
            ${{ runner.temp }}/central-migrations.txt
            ${{ runner.temp }}/onboarding-routes.json
            ${{ runner.temp }}/g01-prepare.json
            ${{ runner.temp }}/full-project-junit.xml
            ${{ runner.temp }}/application-server.log
            ${{ runner.temp }}/g01-browser-evidence
            ${{ runner.temp }}/g01-visual-reference
            core/storage/logs/laravel.log
            core/public/build/manifest.json
          if-no-files-found: ignore
