<svg xmlns="http://www.w3.org/2000/svg" width="320" height="80" viewBox="0 0 320 80">

    <!-- Icon circle -->
    <circle cx="44" cy="40" r="26" fill="#ffffff" opacity="0.12"/>
    <circle cx="44" cy="40" r="22" fill="#ffffff" opacity="0.25"/>

    <!-- Medical Cross Icon -->
    <g transform="translate(44 40)">
        <rect x="-3" y="-10" width="6" height="20" rx="1.5" fill="#ffffff"/>
        <rect x="-10" y="-3" width="20" height="6" rx="1.5" fill="#ffffff"/>
    </g>

    <!-- Brand Name -->
    <text x="82"
          y="35"
          font-family="Georgia, 'Times New Roman', serif"
          font-size="26"
          font-weight="700"
          fill="#ffffff">
        Pharmacy
    </text>

    <!-- Tagline -->
    <text x="83"
          y="54"
          font-family="Arial, Helvetica, sans-serif"
          font-size="10.5"
          font-weight="400"
          fill="#ffffff"
          opacity="0.65"
          letter-spacing="2">
        HEALTH &amp; WELLNESS
    </text>

    <!-- Underline -->
    <line x1="82"
          y1="60"
          x2="200"
          y2="60"
          stroke="#ffffff"
          stroke-width="1.5"
          opacity="0.4"/>

</svg>
