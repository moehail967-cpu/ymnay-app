- id: W06
  name: Expiry and renewal
  actor: scheduler/tenant requester
  trigger: daily command or protected request
  preconditions:
  - Existing expiry/trial/payment/wallet state
  states:
  - expired access
  - renewed; descriptive labels
  steps:
  - Notice
  - optional wallet renewal; middleware access decision
  database_effects:
  - payment_logs
  - wallet records
  - tenants
  events: []
  jobs: []
  notifications: expiry/removal warning mail
  failure_states:
  - insufficient funds/cron/delivery
  related_modules:
  - Wallet
  sources:
  - core/app/Console/Kernel.php
  - core/app/Console/Commands
  evidence: VERIFIED control path; descriptive state labels are not database enums; completion untested
