name: Deploy Ymnay Production

on:
  workflow_dispatch:
    inputs:
      issue_number:
        description: "Tracked GitHub Issue number"
        required: true
        type: string
      expected_sha:
        description: "Optional expected main commit SHA (full or prefix)"
        required: false
        type: string
      confirm:
        description: "Type DEPLOY to confirm Production deployment"
        required: true
        type: string

permissions:
  contents: read
  issues: write

concurrency:
  group: ymnay-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ github.ref == 'refs/heads/main' && inputs.confirm == 'DEPLOY' }}
    runs-on: ubuntu-latest
    environment: production

    env:
      APP_ROOT: /home/ymnay/htdocs/ymnay.com
      HEALTH_URL: https://ymnay.com/
      PROD_HOST: ${{ secrets.PRODUCTION_HOST }}
      PROD_USER: ${{ secrets.PRODUCTION_USER }}
      PROD_PORT: ${{ secrets.PRODUCTION_PORT }}
      ISSUE_NUMBER: ${{ inputs.issue_number }}
      EXPECTED_SHA: ${{ inputs.expected_sha }}
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout canonical main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Verify requested revision
        id: revision
        shell: bash
        run: |
          set -euo pipefail
          SHA="$(git rev-parse HEAD)"
          SHORT_SHA="$(git rev-parse --short=12 HEAD)"
          if [[ -n "${EXPECTED_SHA}" && "${SHA}" != "${EXPECTED_SHA}"* ]]; then
            echo "Expected SHA '${EXPECTED_SHA}' does not match main HEAD '${SHA}'." >&2
            exit 1
          fi
          echo "sha=${SHA}" >> "$GITHUB_OUTPUT"
          echo "short_sha=${SHORT_SHA}" >> "$GITHUB_OUTPUT"

      - name: Build frontend candidate
        working-directory: core
        run: |
          set -euo pipefail
          npm ci
          npm run build

      - name: Prepare SSH
        shell: bash
        run: |
          set -euo pipefail
          : "${PROD_HOST:?Missing PRODUCTION_HOST secret}"
          : "${PROD_USER:?Missing PRODUCTION_USER secret}"
          : "${{ secrets.PRODUCTION_SSH_KEY }}"
          PORT="${PROD_PORT:-22}"
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          printf '%s\n' '${{ secrets.PRODUCTION_SSH_KEY }}' > "$HOME/.ssh/id_deploy"
          chmod 600 "$HOME/.ssh/id_deploy"
          ssh-keyscan -p "$PORT" -H "$PROD_HOST" >> "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"
          echo "PORT=$PORT" >> "$GITHUB_ENV"

      - name: Production preflight
        shell: bash
        run: |
          set -euo pipefail
          ssh -i "$HOME/.ssh/id_deploy" -p "$PORT" "$PROD_USER@$PROD_HOST" \
            "test -d '$APP_ROOT/core' && test -f '$APP_ROOT/core/artisan' && test -f '$APP_ROOT/core/.env' && command -v php >/dev/null && command -v composer >/dev/null && command -v rsync >/dev/null"

      - name: Comment deployment start
        shell: bash
        run: |
          gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body "DEPLOYMENT STARTED

Environment: Production
Commit: \`${{ steps.revision.outputs.sha }}\`
Workflow: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID
Authorized manual deployment from \`main\`."

      - name: Upload deployment filter
        shell: bash
        run: |
          set -euo pipefail
          scp -i "$HOME/.ssh/id_deploy" -P "$PORT" .deployment/rsync-filter.rules "$PROD_USER@$PROD_HOST:/tmp/ymnay-rsync-filter.rules"

      - name: Create filtered source backup
        shell: bash
        run: |
          set -euo pipefail
          ssh -i "$HOME/.ssh/id_deploy" -p "$PORT" "$PROD_USER@$PROD_HOST" "
            set -e
            BACKUP_ROOT=/home/ymnay/deploy-backups
            STAMP=\$(date -u +%Y%m%dT%H%M%SZ)
            BACKUP_DIR=\$BACKUP_ROOT/\${STAMP}-${{ steps.revision.outputs.short_sha }}
            mkdir -p \"\$BACKUP_DIR\"
            rsync -a --filter='merge /tmp/ymnay-rsync-filter.rules' '$APP_ROOT/' \"\$BACKUP_DIR/\"
            printf '%s\n' \"\$BACKUP_DIR\" > /tmp/ymnay-last-backup-path
            find \"\$BACKUP_ROOT\" -mindepth 1 -maxdepth 1 -type d -printf '%T@ %p\n' | sort -nr | tail -n +6 | cut -d' ' -f2- | xargs -r rm -rf
          "

      - name: Enable Laravel maintenance mode
        shell: bash
        run: |
          ssh -i "$HOME/.ssh/id_deploy" -p "$PORT" "$PROD_USER@$PROD_HOST" "cd '$APP_ROOT/core' && php artisan down --retry=60 || true"

      - name: Sync approved source and build output
        shell: bash
        run: |
          set -euo pipefail
          rsync -az --delete --itemize-changes \
            --filter='merge .deployment/rsync-filter.rules' \
            -e "ssh -i $HOME/.ssh/id_deploy -p $PORT" \
            ./ "$PROD_USER@$PROD_HOST:$APP_ROOT/"

      - name: Install production PHP dependencies and clear caches
        shell: bash
        run: |
          set -euo pipefail
          ssh -i "$HOME/.ssh/id_deploy" -p "$PORT" "$PROD_USER@$PROD_HOST" "
            set -e
            cd '$APP_ROOT/core'
            composer install --no-dev --prefer-dist --no-interaction --optimize-autoloader
            php artisan optimize:clear
            php artisan --version
            php artisan up
          "

      - name: Public health check
        shell: bash
        run: |
          set -euo pipefail
          curl -fLsS --retry 4 --retry-delay 5 --connect-timeout 15 --max-time 30 "$HEALTH_URL" >/dev/null

      - name: Comment deployment success
        if: success()
        shell: bash
        run: |
          gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body "DEPLOYMENT SUCCESS

Environment: Production
Deployed commit: \`${{ steps.revision.outputs.sha }}\`
Health check: PASS — $HEALTH_URL
Workflow: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID

Update the Issue TASK CONTROL status to \`DEPLOYED\`, then \`DONE\` when any required post-deploy verification is complete."

      - name: Ensure application exits maintenance mode
        if: always()
        shell: bash
        run: |
          ssh -i "$HOME/.ssh/id_deploy" -p "$PORT" "$PROD_USER@$PROD_HOST" "cd '$APP_ROOT/core' && php artisan up || true" || true

      - name: Comment deployment failure
        if: failure()
        shell: bash
        run: |
          BACKUP_PATH="$(ssh -i "$HOME/.ssh/id_deploy" -p "$PORT" "$PROD_USER@$PROD_HOST" 'cat /tmp/ymnay-last-backup-path 2>/dev/null || true' || true)"
          gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body "DEPLOYMENT FAILED

Environment: Production
Candidate commit: \`${{ steps.revision.outputs.sha }}\`
Workflow: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID
Backup candidate: \`${BACKUP_PATH:-unknown}\`

Set the task status to \`DEPLOY_FAILED\`. Do not improvise a database rollback. If source rollback is required, use \`ROLLBACK_REQUIRED\` and obtain explicit owner authorization."
