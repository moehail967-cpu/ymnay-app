<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" width="320" height="80">

    <!-- Icon circle -->
    <circle cx="44" cy="40" r="26" fill="#ffffff" opacity="0.12"/>
    <circle cx="44" cy="40" r="22" fill="#ffffff" opacity="0.25"/>

    <!-- Diamond Icon -->
    <g transform="translate(44 40)">
        <polygon
            points="-10,-6 -4,-12 4,-12 10,-6 0,12"
            fill="none"
            stroke="#ffffff"
            stroke-width="1.8"
            stroke-linejoin="round"/>

        <line x1="-10" y1="-6" x2="10" y2="-6"
              stroke="#ffffff" stroke-width="1.2"/>

        <line x1="-4" y1="-12" x2="0" y2="12"
              stroke="#ffffff" stroke-width="1.2"/>

        <line x1="4" y1="-12" x2="0" y2="12"
              stroke="#ffffff" stroke-width="1.2"/>

        <line x1="0" y1="-12" x2="0" y2="12"
              stroke="#ffffff" stroke-width="1.2"/>
    </g>

    <!-- Brand name -->
    <text x="82"
          y="35"
          font-family="Georgia, 'Times New Roman', serif"
          font-size="26"
          font-weight="700"
          fill="#ffffff">
        Luxe<tspan opacity="0.75">Gems</tspan>
    </text>

    <!-- Tagline -->
    <text x="83"
          y="54"
          font-family="Arial, Helvetica, sans-serif"
          font-size="10.5"
          font-weight="400"
          fill="#ffffff"
          opacity="0.6"
          letter-spacing="2.5">
        RARE &amp; PRECIOUS
    </text>

    <!-- Underline -->
    <line
        x1="82"
        y1="59"
        x2="175"
        y2="59"
        stroke="#ffffff"
        stroke-width="1.5"
        opacity="0.4"/>

</svg>
