          opacity="0.75">
        TOYS &amp; FUN
    </text>

    <!-- Underline -->
    <line x1="82"
          y1="60"
          x2="165"
          y2="60"
          stroke="#FFFFFF"
          stroke-width="2"
          stroke-linecap="round"
          opacity="0.5"/>

</svg>
